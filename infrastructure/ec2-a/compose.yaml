name: nilm-a
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start", "--import-realm"]
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD required}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST required}:5432/keycloak_db
      KC_DB_USERNAME: ${POSTGRES_USER:?POSTGRES_USER required}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:?KEYCLOAK_HOSTNAME required}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN required}
      NILM_SMOKE_CLIENT_SECRET: ${NILM_SMOKE_CLIENT_SECRET:?NILM_SMOKE_CLIENT_SECRET required}
      NILM_BACKEND_CLIENT_SECRET: ${NILM_BACKEND_CLIENT_SECRET:?NILM_BACKEND_CLIENT_SECRET required}
    volumes:
      - ${CONFIG_ROOT:-.}/keycloak/nilm-realm.json:/opt/keycloak/data/import/nilm-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api-gateway:
    image: ${API_GATEWAY_IMAGE:?API_GATEWAY_IMAGE required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      APP_SECURITY_ENABLED: "${APP_SECURITY_ENABLED:-true}"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nilm/protocol/openid-connect/certs
      IOT_DEVICE_SERVICE_URL: http://iot-device-service:8081
      MONITORING_SERVICE_URL: http://monitoring-service:8082
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS required}
    depends_on:
      keycloak:
        condition: service_healthy
      iot-device-service:
        condition: service_healthy
      monitoring-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  iot-device-service:
    image: ${IOT_DEVICE_IMAGE:?IOT_DEVICE_IMAGE required}
    restart: unless-stopped
    environment:
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: nilm
      NILM_BACKEND_CLIENT_SECRET: ${NILM_BACKEND_CLIENT_SECRET:?NILM_BACKEND_CLIENT_SECRET required}
      SERVER_PORT: 8081
      APP_SECURITY_ENABLED: "${APP_SECURITY_ENABLED:-true}"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nilm/protocol/openid-connect/certs
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST required}:5432/device_db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS required}
      KAFKA_MANAGER_REGISTERED_TOPIC: ${KAFKA_MANAGER_REGISTERED_TOPIC:-device.manager-registered.v1}
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  monitoring-service:
    image: ${MONITORING_IMAGE:?MONITORING_IMAGE required}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      APP_SECURITY_ENABLED: "${APP_SECURITY_ENABLED:-true}"
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:?JWT_ISSUER_URI required}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/nilm/protocol/openid-connect/certs
      POSTGRES_URL: jdbc:postgresql://${POSTGRES_HOST:?POSTGRES_HOST required}:5432/monitoring_db
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_HEALTH_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:?KAFKA_BOOTSTRAP_SERVERS required}
      KAFKA_ANALYSIS_EVENT_TOPIC: ${KAFKA_ANALYSIS_EVENT_TOPIC:-analysis.event.v1}
      KAFKA_MONITORING_DLQ_TOPIC: ${KAFKA_MONITORING_DLQ_TOPIC:-dlq.monitoring}
      KAFKA_OUTING_EVENT_TOPIC: ${KAFKA_OUTING_EVENT_TOPIC:-monitoring.household-presence.v1}
      KAFKA_HOUSEHOLD_PROFILE_TOPIC: ${KAFKA_HOUSEHOLD_PROFILE_TOPIC:-gold.household-profile.v1}
      KAFKA_MANAGER_REGISTERED_TOPIC: ${KAFKA_MANAGER_REGISTERED_TOPIC:-device.manager-registered.v1}
      MONITORING_KAFKA_GROUP_ID: ${MONITORING_KAFKA_GROUP_ID:-monitoring-service-analysis-event-v1}
      MONITORING_KAFKA_HOUSEHOLD_PROFILE_GROUP_ID: ${MONITORING_KAFKA_HOUSEHOLD_PROFILE_GROUP_ID:-monitoring-service-household-profile-v1}
      PROFILE_MAX_AGE_DAYS: "${PROFILE_MAX_AGE_DAYS:-3}"
      KAFKA_AUTO_OFFSET_RESET: ${KAFKA_AUTO_OFFSET_RESET:-latest}
      KAFKA_CONSUMER_ENABLED: "${KAFKA_CONSUMER_ENABLED:-true}"
      WEB_PUSH_ENABLED: "${WEB_PUSH_ENABLED:-false}"
      WEB_PUSH_VAPID_PUBLIC_KEY: "${WEB_PUSH_VAPID_PUBLIC_KEY:-}"
      WEB_PUSH_VAPID_PRIVATE_KEY: "${WEB_PUSH_VAPID_PRIVATE_KEY:-}"
      WEB_PUSH_SUBJECT: "${WEB_PUSH_SUBJECT:-mailto:admin@example.com}"
      PUSH_TEST_AUTH_SUB: "${PUSH_TEST_AUTH_SUB:-test-subject-3}"
      TEST_DATA_ENABLED: "${TEST_DATA_ENABLED:-false}"
      TEST_ACCOUNT_PASSWORD: "${TEST_ACCOUNT_PASSWORD:-}"
      IOT_DEVICE_SERVICE_URL: http://iot-device-service:8081
      RISK_WARNING_THRESHOLD: "${RISK_WARNING_THRESHOLD:-70}"
      RISK_DANGER_THRESHOLD: "${RISK_DANGER_THRESHOLD:-90}"
    depends_on:
      keycloak:
        condition: service_healthy
      iot-device-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 18
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "8883:8883"
    volumes:
      - ${CONFIG_ROOT:-.}/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ${CONFIG_ROOT:-.}/mqtt/passwd:/mosquitto/config/passwd:ro
      - ${CONFIG_ROOT:-.}/mqtt/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 시연용 시뮬레이터. 배포(deploy.sh)에서는 띄우지 않으며 필요할 때만 수동으로 기동한다.
  #   docker compose --profile simulator up -d simulator
  # 접속은 frontend nginx의 https://<APP_DOMAIN>/simulator/ (기본 인증)로 한다.
  # 제어 API에 인증이 없으므로 호스트 포트는 루프백에만 열어 SSH 터널 접속용으로만 남긴다.
  simulator:
    image: ${SIMULATOR_IMAGE:?SIMULATOR_IMAGE required}
    profiles: ["simulator"]
    restart: unless-stopped
    environment:
      # profile로 꺼져 있어도 compose는 전체 파일을 보간하므로 필수(:?)로 두지 않는다.
      MQTT_HOST: ${SIMULATOR_MQTT_HOST:-}
      MQTT_PORT: 8883
      MQTT_TLS_ENABLED: "true"
      MQTT_USER: ${SIMULATOR_MQTT_USER:-simulator_user}
      MQTT_PASS: ${SIMULATOR_MQTT_PASS:-}
      MQTT_CA_FILE: /certs/ca.crt
    ports:
      - "127.0.0.1:${SIMULATOR_WEB_PORT:-8085}:8085"
    volumes:
      - type: bind
        source: ${SIMULATOR_MQTT_CA_FILE:-/opt/nilm/mqtt/certs/ca.crt}
        target: /certs/ca.crt
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mosquitto:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ${FRONTEND_IMAGE:?FRONTEND_IMAGE required}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN required}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN required}
      NGINX_ENVSUBST_FILTER: "^(APP_DOMAIN|AUTH_DOMAIN)$$"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ${CONFIG_ROOT:-.}/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${CONFIG_ROOT:-.}/certs:/etc/nginx/certs:ro
      # /simulator/ 기본 인증 파일(simulator.htpasswd). 서버에서 직접 만들며 저장소에 넣지 않는다.
      - ${CONFIG_ROOT:-.}/nginx/auth:/etc/nginx/auth:ro
    depends_on:
      api-gateway:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/prometheus/targets/ec2-a:/etc/prometheus/targets:ro
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/prometheus/resources-disabled:/etc/prometheus/resources:ro
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "ec2-b.internal:${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
      GRAFANA_REPORTING_DB_HOST: ${GRAFANA_REPORTING_DB_HOST:-localhost:5432}
      GRAFANA_REPORTING_DB_NAME: ${GRAFANA_REPORTING_DB_NAME:-monitoring_db}
      GRAFANA_REPORTING_DB_USER: ${GRAFANA_REPORTING_DB_USER:-grafana_reporting}
      GRAFANA_REPORTING_DB_PASSWORD: ${GRAFANA_REPORTING_DB_PASSWORD:-}
      GRAFANA_REPORTING_DB_SSLMODE: ${GRAFANA_REPORTING_DB_SSLMODE:-require}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-13001}:3000"
    volumes:
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ${OBSERVABILITY_ROOT:?OBSERVABILITY_ROOT required}/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    extra_hosts:
      - "ec2-b.internal:${EC2_B_PRIVATE_IP:?EC2_B_PRIVATE_IP required}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9115/-/healthy >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redis_data:
    name: nilm-a_redis_data
  mosquitto_data:
    name: nilm-a_mosquitto_data
  prometheus_data:
    name: nilm-a_prometheus_data
  grafana_data:
    name: nilm-a_grafana_data
