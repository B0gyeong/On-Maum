# 테스트 전용 설정: PostgreSQL 없이 H2 인메모리 DB로 실행된다.
spring.datasource.url=jdbc:h2:mem:monitoring_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

management.health.redis.enabled=false
# 테스트에는 Redis가 없다. 적분 기준점을 인스턴스 안에 들고 있는다.
app.power-usage.snapshot-store=memory
app.security.enabled=false
app.test-data.enabled=false

app.push.test-auth-sub=test-subject-3
app.push.enabled=false
app.away-mode.scheduler-enabled=false
# 타이머 평가는 테스트가 직접 부른다. 배경에서 돌면 단정이 흔들린다.
app.risk.scheduler-enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.consumer.group-id=monitoring-test
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 브로커 없이 도는 테스트라 발행은 실패한다. 대기 없이 즉시 실패하게 둔다.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.properties.max.block.ms=100

# 위험 평가 정책. 테스트는 이 파일이 main의 application.properties를 대신하므로
# 운영과 같은 기본값을 여기에도 둔다. 값이 중요한 테스트는 각자 프로퍼티를 덮어쓴다.
app.risk.policy-version=policy-v2-experimental
app.risk.warning-threshold=70
app.risk.danger-threshold=90
app.risk.z-low=2
app.risk.z-high=6
app.risk.min-sample-count=7
app.risk.min-eligible-days=14

# 하루치 단정을 세우기 위한 최소 관측 커버리지. Gold가 기준선 표본으로 쓰는
# 관측일의 커버리지 하한(power-silver valid_coverage_ratio)과 같은 값이다.
app.risk.min-observation-coverage=0.95
# 스냅샷 사이가 이보다 벌어지면 보지 못한 구간으로 적는다.
app.risk.observation-gap-threshold=120s
app.risk.observation-max-age=15m
app.risk.profile-max-age=3d
app.risk.realert-interval=1h
app.risk.assessment-log-interval=30m
app.risk.event-level-max-hold=6h
app.risk.scheduler-interval-ms=60000
app.risk.scheduler-initial-delay-ms=0

app.risk.event-routing.PROLONGED_APPLIANCE_USE=IMMEDIATE:DANGER
app.risk.event-routing.PROLONGED_INACTIVITY=IMMEDIATE:WARNING
app.risk.event-routing.ROUTINE_MISSED=SHADOW
app.risk.event-routing.default=EVIDENCE
app.risk.event-routing.suppress-while-away=PROLONGED_INACTIVITY,ROUTINE_MISSED
app.risk.event-routing.response-deadline-seconds=1800
