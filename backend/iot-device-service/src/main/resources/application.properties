spring.application.name=iot-device-service
server.port=${SERVER_PORT:8081}

# DB 비밀번호는 POSTGRES_PASSWORD 환경변수로 주입
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/device_db}
spring.datasource.username=${POSTGRES_USER:nilm_admin}
spring.datasource.password=${POSTGRES_PASSWORD:}

# JPA: 스키마 변경은 Flyway로만 관리
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 보안 스위치: false면 Keycloak 없이 실행 가능 (모든 요청 허용)
app.security.enabled=${APP_SECURITY_ENABLED:false}
# Keycloak 도입 후 보안을 켤 때 주석 해제하고 환경변수로 주입
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8090/realms/nilm}

# Actuator / OpenAPI
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
springdoc.swagger-ui.path=/swagger-ui.html

# Keycloak 연동 — 신원(계정·비밀번호·토큰)은 Keycloak 소유
app.keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8090}
app.keycloak.realm=${KEYCLOAK_REALM:nilm}
app.keycloak.client-id=${KEYCLOAK_BACKEND_CLIENT_ID:nilm-backend}
app.keycloak.client-secret=${NILM_BACKEND_CLIENT_SECRET:}

# Kafka 연결 — 담당자 가입을 monitoring-service로 내보내는 데만 쓴다.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# 브로커가 없을 때 릴레이 스레드가 오래 잡히지 않게 한다. 실패한 행은 다음 주기에 다시 나간다.
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}

app.kafka.manager-registered-topic=${KAFKA_MANAGER_REGISTERED_TOPIC:device.manager-registered.v1}
app.manager-registration.publisher.enabled=${MANAGER_REGISTRATION_PUBLISHER_ENABLED:true}
app.manager-registration.publisher.interval-ms=${MANAGER_REGISTRATION_PUBLISHER_INTERVAL_MS:5000}
app.manager-registration.publisher.batch-size=100
app.manager-registration.publisher.retry-after=30s
app.manager-registration.publisher.send-timeout=10s

# MQTT ACL — acl_file을 켜면 파일에 없는 사용자는 모든 토픽이 막힌다.
# 기기가 아닌 공용 계정(시뮬레이터 발행, 브릿지 구독)을 여기서 넣어 준다.
# 형식: 사용자명:read|write|readwrite:토픽 (쉼표 구분)
app.mqtt.static-acl=${MQTT_STATIC_ACL:simulator_user:write:v1/power/sim/#,kafka_bridge_user:read:v1/power/sim/#,kafka_bridge_user:read:v1/device/#}

# 기기 접속 상태(LWT) 수신 — 브로커가 없어도 서비스는 정상 기동한다.
# 기기 규약: v1/device/{deviceId}/status 에 online/offline 을 retain=true 로 발행,
#            접속 시 LWT로 offline 을 등록.
app.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
app.mqtt.connection-listener.enabled=${MQTT_CONNECTION_LISTENER_ENABLED:false}
app.mqtt.connection-listener.username=${MQTT_USER:}
app.mqtt.connection-listener.password=${MQTT_PASS:}
app.mqtt.connection-listener.topic=${MQTT_STATUS_TOPIC:v1/device/+/status}

# 기기 접속 상태 변화를 monitoring에 알린다 — 오경보 방지 판정에 쓰인다.
app.kafka.device-connection-topic=${KAFKA_DEVICE_CONNECTION_TOPIC:device.connection-changed.v1}
app.kafka.device-connection-publish-enabled=${DEVICE_CONNECTION_PUBLISH_ENABLED:true}
