spring.application.name=monitoring-service
server.port=${SERVER_PORT:8082}

# DB (비밀번호는 반드시 환경변수 POSTGRES_PASSWORD로 주입 - 하드코딩 금지)
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/monitoring_db}
spring.datasource.username=${POSTGRES_USER:nilm_admin}
spring.datasource.password=${POSTGRES_PASSWORD:1234}

# JPA: 스키마 변경은 Flyway로만 관리
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis 연결 준비 (아직 미사용) - 로컬에 Redis가 없어도 실행되도록 헬스 지표는 꺼둔다
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
management.health.redis.enabled=${REDIS_HEALTH_ENABLED:false}

# 보안 스위치: false면 Keycloak 없이 실행 가능 (모든 요청 허용)
app.security.enabled=${APP_SECURITY_ENABLED:true}
# Keycloak 도입 후 보안을 켤 때 주석 해제하고 환경변수로 주입
spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:http://localhost:8090/realms/nilm}

# 스택 트레이스는 근본 원인부터 15줄까지만. 필터 체인·JDK 내부 프레임은 뺀다.
logging.exception-conversion-word=%rEx{15, org.springframework.security, org.springframework.web.filter, org.apache.catalina, org.apache.coyote, org.apache.tomcat, jakarta.servlet, jdk.internal, java.base}

# Actuator / OpenAPI
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
# kafkaListeners: 리스너 컨테이너가 멈추면 readiness가 DOWN이 된다 (KafkaListenerHealthIndicator)
management.endpoint.health.group.readiness.include=readinessState,db,kafkaListeners
springdoc.swagger-ui.path=/swagger-ui.html

# 인증 연결 전 구독 등록과 알림 생성에 공통으로 사용하는 테스트 식별자
app.push.test-auth-sub=${PUSH_TEST_AUTH_SUB:test-subject-3}

# 로컬 테스트 데이터: 실제 회원가입·가구 등록 API를 통해 대상자/담당자 10명씩 생성
app.test-data.enabled=${TEST_DATA_ENABLED:true}
app.test-data.device-service-url=${IOT_DEVICE_SERVICE_URL:http://localhost:8081}
app.test-data.password=${TEST_ACCOUNT_PASSWORD:NilmTest1234!}

# VAPID(Web Push) 설정
app.push.enabled=${WEB_PUSH_ENABLED:false}
app.push.vapid-public-key=${WEB_PUSH_VAPID_PUBLIC_KEY}
app.push.vapid-private-key=${WEB_PUSH_VAPID_PRIVATE_KEY}
app.push.vapid-subject=${WEB_PUSH_SUBJECT:${WEB_PUSH_VAPID_SUBJECT:}}

# Kafka 연결
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer 그룹
spring.kafka.consumer.group-id=${MONITORING_KAFKA_GROUP_ID:monitoring-service-analysis-event-v1}

# 저장된 소비 위치가 없으면 보관 중인 가장 오래된 메시지부터 수신
spring.kafka.consumer.auto-offset-reset=${KAFKA_AUTO_OFFSET_RESET:earliest}

# 메시지를 문자열로 수신
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# 리스너 처리가 정상적으로 끝난 메시지의 소비 위치를 커밋
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

# Consumer 실행 여부
spring.kafka.listener.auto-startup=${KAFKA_CONSUMER_ENABLED:true}

# Producer: 한 가구의 외출 시작/종료가 보낸 순서대로 남도록 멱등 발행을 켠다
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true

# 브로커가 죽어 있을 때 외출 설정 API가 오래 붙잡히지 않도록 메타데이터 대기를 줄인다
spring.kafka.producer.properties.max.block.ms=${KAFKA_PRODUCER_MAX_BLOCK_MS:3000}

# 구독할 토픽
app.kafka.analysis-event-topic=${KAFKA_ANALYSIS_EVENT_TOPIC:analysis.event.v1}
# 가전 ON/OFF 스냅샷. 이상 징후와 처리 흐름이 달라 소비 그룹을 분리한다.
app.kafka.analysis-snapshot-topic=${KAFKA_ANALYSIS_SNAPSHOT_TOPIC:analysis.snapshot.v1}
app.kafka.analysis-snapshot-group-id=${MONITORING_KAFKA_SNAPSHOT_GROUP_ID:monitoring-service-analysis-snapshot-v1}

# Gold 배치가 만든 가구 생활 프로필. 가구·버전당 1건이고 Key는 household_id.
# 수신 흐름이 달라 소비 그룹을 분리한다.
app.kafka.household-profile-topic=${KAFKA_HOUSEHOLD_PROFILE_TOPIC:gold.household-profile.v1}
app.kafka.household-profile-group-id=${MONITORING_KAFKA_HOUSEHOLD_PROFILE_GROUP_ID:monitoring-service-household-profile-v1}

# 발행할 토픽: 외출 시작/종료를 AI 분석 서비스로 전달한다. Key는 household_id.
app.kafka.outing-event-topic=${KAFKA_OUTING_EVENT_TOPIC:monitoring.household-presence.v1}

# 담당자 가입 — iot-device-service의 아웃박스가 보낸다.
app.kafka.manager-registered-topic=${KAFKA_MANAGER_REGISTERED_TOPIC:device.manager-registered.v1}
app.kafka.manager-registered-group-id=${MONITORING_KAFKA_MANAGER_REGISTERED_GROUP_ID:monitoring-service-manager-registered-v1}

# 예약된 외출의 시작/종료를 반영하는 주기. 위험 판정은 이 주기와 무관하게 즉시 계산한다.
app.away-mode.scheduler-enabled=${AWAY_MODE_SCHEDULER_ENABLED:true}
app.away-mode.scheduler-interval-ms=${AWAY_MODE_SCHEDULER_INTERVAL_MS:30000}

# 시간별 전력 사용량 적산.
# 최신 스냅샷은 Redis에 두고 적분 기준점으로만 쓴다. memory로 바꾸면 인스턴스 안에 들고 있는다.
app.power-usage.snapshot-store=${POWER_USAGE_SNAPSHOT_STORE:redis}
app.power-usage.snapshot-ttl=${POWER_USAGE_SNAPSHOT_TTL:1h}

# 이보다 길게 끊긴 구간은 적분하지 않는다. 분석 서비스의 데이터 공백 기준과 같은 값이다.
app.power-usage.gap-threshold=${POWER_USAGE_GAP_THRESHOLD:120s}

# 끝난 구간을 COMPLETE로 볼 관측 커버리지 하한. 못 미치면 PARTIAL, 아예 없으면 NO_DATA다.
app.power-usage.complete-coverage-ratio=${POWER_USAGE_COMPLETE_COVERAGE_RATIO:0.9}

# 6종 밖 상시 부하(대기전력 + 냉장고)의 시간 평균. 가전별 배분 전에 빼는 값이다.
app.power-usage.base-load-watts=${POWER_USAGE_BASE_LOAD_WATTS:82}

# 가전별 배분 가중치는 AI Hub 71685 실측 중앙값이라 코드에 기본값으로 둔다.
# 바꿔야 하면 app.power-usage.appliance-weights.<가전>으로 덮어쓴다.

# 위험 평가 정책.
# 설계 11.2/11.3절이 "미검증 정책안"이라고 명시한 값들이다. 확정식이 아니므로
# 어떤 값도 코드에 박지 않고 여기에서 전부 조정한다. 평가 이력에는 policy-version이 함께 남아
# 나중에 "그때 어떤 값으로 계산했는가"를 되짚을 수 있다.
app.risk.policy-version=${RISK_POLICY_VERSION:policy-v1-experimental}
app.risk.warning-threshold=${RISK_WARNING_THRESHOLD:70}
app.risk.danger-threshold=${RISK_DANGER_THRESHOLD:90}

# 등급 전이 히스테리시스. 임계를 한 번 스쳤다고 올리지 않고, 내릴 때도 곧바로 내리지 않는다.
app.risk.raise-hold=${RISK_RAISE_HOLD:10m}
app.risk.recover-below=${RISK_RECOVER_BELOW:60}
app.risk.recover-hold=${RISK_RECOVER_HOLD:30m}

# 지표 점수의 z 구간. 설계 11.2절의 a=2, b=6에 해당하는 실험값이다.
app.risk.z-low=${RISK_Z_LOW:2}
app.risk.z-high=${RISK_Z_HIGH:6}

# 표본이 작거나 MAD가 0이어도 분모가 0이 되지 않게 하는 바닥값들.
app.risk.min-spread-seconds=${RISK_MIN_SPREAD_SECONDS:900}
app.risk.min-grace=${RISK_MIN_GRACE:30m}
app.risk.min-sample-count=${RISK_MIN_SAMPLE_COUNT:7}
app.risk.min-eligible-days=${RISK_MIN_ELIGIBLE_DAYS:14}

# 하루치 단정을 세우기 위한 최소 관측 커버리지. Gold가 기준선 표본으로 쓰는
# 관측일의 커버리지 하한(power-silver valid_coverage_ratio)과 같은 값이다.
app.risk.min-observation-coverage=${RISK_MIN_OBSERVATION_COVERAGE:0.95}
# 스냅샷 사이가 이보다 벌어지면 보지 못한 구간으로 적는다.
app.risk.observation-gap-threshold=${RISK_OBSERVATION_GAP_THRESHOLD:120s}

# 입력 신선도. 스냅샷이 이보다 오래 끊기면 무활동/활동량 지표를 계산하지 않는다.
app.risk.observation-max-age=${RISK_OBSERVATION_MAX_AGE:15m}
app.risk.profile-max-age=${RISK_PROFILE_MAX_AGE:3d}

# 같은 등급이 이어질 때 알림을 다시 보내기까지의 간격.
app.risk.realert-interval=${RISK_REALERT_INTERVAL:1h}

# 같은 결과가 이어지는 동안 평가 이력을 남기는 간격.
app.risk.assessment-log-interval=${RISK_ASSESSMENT_LOG_INTERVAL:30m}

# 이벤트 등급 슬롯의 최대 유지시간. 해제 신호를 놓쳤을 때의 안전장치다.
app.risk.event-level-max-hold=${RISK_EVENT_LEVEL_MAX_HOLD:6h}

# 이벤트가 오지 않는 동안에도 시계를 보는 타이머 평가.
app.risk.scheduler-enabled=${RISK_SCHEDULER_ENABLED:true}
app.risk.scheduler-interval-ms=${RISK_SCHEDULER_INTERVAL_MS:60000}
# 기동 후 첫 실행까지의 지연. 운영은 바로 돈다.
app.risk.scheduler-initial-delay-ms=${RISK_SCHEDULER_INITIAL_DELAY_MS:0}

# 이벤트 유형별 라우팅(설계 11.4절).
#   IMMEDIATE:<등급>  즉시 그 등급으로 알림까지 낸다. 계약에 score가 없어 등급을 고정값으로 둔다.
#   SHADOW            저장/화면 표시만. 모니터링 자체 평가와 비교하는 기간에 쓴다.
#   EVIDENCE          저장만. 알 수 없는 유형의 기본값이라 새 유형이 와도 소비자가 멈추지 않는다.
# 되돌리기는 이 줄을 IMMEDIATE로 바꾸는 것으로 끝나야 한다.
app.risk.event-routing.PROLONGED_APPLIANCE_USE=IMMEDIATE:DANGER
app.risk.event-routing.PROLONGED_INACTIVITY=IMMEDIATE:WARNING
app.risk.event-routing.ROUTINE_MISSED=SHADOW
app.risk.event-routing.default=EVIDENCE
# 장시간 사용은 부재 중일수록 위험하므로 외출 억제 목록에 넣지 않는다.
app.risk.event-routing.suppress-while-away=PROLONGED_INACTIVITY,ROUTINE_MISSED
# 기기가 꺼져 있던 구간의 이벤트는 사람에 대한 신호가 아니다 (오경보 방지).
# 무활동·루틴 미사용만 대상이다. 장시간 가전 사용은 이미 켜져 있던 사실에
# 근거하므로 기기가 나중에 끊겼다고 취소할 이유가 없다.
app.risk.event-routing.suppress-while-device-offline=PROLONGED_INACTIVITY,ROUTINE_MISSED
app.risk.event-routing.response-required=PROLONGED_INACTIVITY,PROLONGED_APPLIANCE_USE
app.risk.event-routing.response-deadline-seconds=${RISK_RESPONSE_DEADLINE_SECONDS:60}

# 프로필 유효기간(일). 평가 시각의 KST 날짜와 as_of_date 간격이 이 값을 넘으면
# 버리지 않고 stale로 표시만 한다. 쓸지 말지는 평가 정책이 정한다.
app.profile.max-age-days=${PROFILE_MAX_AGE_DAYS:3}

# 기기 접속 상태 수신 (device-service가 MQTT LWT로 감지)
app.kafka.device-connection-topic=${KAFKA_DEVICE_CONNECTION_TOPIC:device.connection-changed.v1}
app.kafka.device-connection-group-id=${MONITORING_KAFKA_DEVICE_CONNECTION_GROUP_ID:monitoring-service-device-connection-v1}
