listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
# 인가: iot-device-service가 device_acl에서 생성한다 (POST /api/devices/admin/mqtt/sync).
# 이 파일에 없는 사용자는 모든 토픽이 막히므로, 공용 계정(시뮬레이터·브릿지)도
# app.mqtt.static-acl 설정을 통해 함께 기록된다.
acl_file /mosquitto/config/acl.device
max_connections 500
persistence true
persistence_location /mosquitto/data/
message_size_limit 262144
log_dest stdout

max_inflight_messages 1000
max_queued_messages 100000
